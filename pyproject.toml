[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=long -s"
log_cli = true
log_cli_level = "INFO"
log_file = "tests/logs/pytest_latest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s │ %(levelname)-7s │ %(name)s │ %(message)s"
